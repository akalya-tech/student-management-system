<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>Student Management System</h1>
  <p>HTML · CSS · JavaScript &rarr; Django REST API &rarr; SQLite</p>
</header>

<main class="container">

  <!-- Form Section -->
  <section class="card">
    <h2 id="form-title">Add Student</h2>
    <form id="student-form" novalidate>
      <input type="hidden" id="student-id">

      <div class="form-row">
        <label for="name">Full Name</label>
        <input type="text" id="name" required minlength="2" placeholder="e.g. Akalya Arthanari">
        <span class="error-text" id="err-name"></span>
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="e.g. student@college.edu">
        <span class="error-text" id="err-email"></span>
      </div>

      <div class="form-row">
        <label for="department">Department</label>
        <select id="department" required>
          <option value="">-- Select Department --</option>
          <option value="CSE">Computer Science and Engineering</option>
          <option value="AIML">AI & Machine Learning</option>
          <option value="ECE">Electronics and Communication</option>
          <option value="EEE">Electrical and Electronics</option>
          <option value="MECH">Mechanical Engineering</option>
          <option value="CIVIL">Civil Engineering</option>
          <option value="IT">Information Technology</option>
        </select>
        <span class="error-text" id="err-department"></span>
      </div>

      <div class="form-row">
        <label for="year">Year</label>
        <input type="number" id="year" required min="1" max="5" placeholder="1-5">
        <span class="error-text" id="err-year"></span>
      </div>

      <div class="form-row">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" required maxlength="10" placeholder="10-digit number">
        <span class="error-text" id="err-phone"></span>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn">Add Student</button>
        <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
      </div>
      <p id="form-message" class="form-message"></p>
    </form>
  </section>

  <!-- List Section -->
  <section class="card">
    <div class="list-header">
      <h2>Students</h2>
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="Search by name or email...">
        <select id="filter-department">
          <option value="">All Departments</option>
          <option value="CSE">CSE</option>
          <option value="AIML">AI & ML</option>
          <option value="ECE">ECE</option>
          <option value="EEE">EEE</option>
          <option value="MECH">MECH</option>
          <option value="CIVIL">CIVIL</option>
          <option value="IT">IT</option>
        </select>
      </div>
    </div>

    <div id="status-message" class="status-message"></div>

    <div class="table-wrapper">
      <table id="student-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Year</th>
            <th>Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="student-table-body">
          <!-- rows injected by script.js -->
        </tbody>
      </table>
    </div>
  </section>

</main>

<!-- Delete Confirmation Modal -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-content">
    <p id="confirm-text">Delete this student?</p>
    <div class="modal-actions">
      <button id="confirm-yes" class="danger">Delete</button>
      <button id="confirm-no" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
